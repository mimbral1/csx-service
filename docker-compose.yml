version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: csx-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrongPassword123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - csx-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: csx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - csx-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: csx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: csx-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - csx-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: csx-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: csx-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: csx-kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: csx-zookeeper:2181
    networks:
      - csx-network

volumes:
  sqlserver_data:

networks:
  csx-network:
    driver: bridge
